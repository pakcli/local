name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Plugin
        run: npm run build

      - name: Generate Build Attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create and Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          
          if [ -f styles.css ]; then
            gh release create "$tag"               --title="$tag"               --generate-notes               main.js manifest.json styles.css || gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag"               --title="$tag"               --generate-notes               main.js manifest.json || gh release upload "$tag" main.js manifest.json --clobber
          fi
